    <rect x="6" y="368" width="300" height="7" rx="4" fill="#f7b733"/>
    <text x="8" y="424" font-size="44" font-weight="700" fill="#f2662f" letter-spacing="4">鬼ごっこネタ発掘</text>
    <text x="8" y="476" font-size="29" fill="#9c7d6b" letter-spacing="2">映画・ゲーム・トレンドから、次の企画を。</text>
