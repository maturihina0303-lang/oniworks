<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Hiragino Maru Gothic ProN','Yu Gothic','Meiryo',sans-serif">
  <defs>
    <radialGradient id="bg" cx="76%" cy="14%" r="85%">
      <stop offset="0" stop-color="#3c211c"/>
      <stop offset="52%" stop-color="#1b1310"/>
      <stop offset="100%" stop-color="#120d0c"/>
    </radialGradient>
    <linearGradient id="works" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6a45"/>
      <stop offset="1" stop-color="#e2361f"/>
    </linearGradient>
    <radialGradient id="face" cx="42%" cy="34%" r="72%">
      <stop offset="0" stop-color="#f2503a"/>
      <stop offset="70%" stop-color="#d8301f"/>
      <stop offset="100%" stop-color="#a81f14"/>
    </radialGradient>
    <linearGradient id="horn" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e8b45a"/>
      <stop offset="1" stop-color="#fff2d6"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <!-- 斜めスラッシュ装飾 -->
  <g opacity="0.6">
    <polygon points="980,-40 1120,-40 900,760 760,760" fill="#e2361f" opacity="0.10"/>
    <polygon points="1120,-40 1200,-40 980,760 900,760" fill="#f5c451" opacity="0.08"/>
  </g>
  <!-- 火花ドット -->
  <g fill="#f5c451" opacity="0.75">
    <circle cx="1150" cy="120" r="4"/><circle cx="1090" cy="240" r="3"/>
    <circle cx="1210" cy="330" r="3"/><circle cx="640" cy="90" r="3"/>
    <circle cx="560" cy="150" r="2.5"/><circle cx="1170" cy="560" r="3"/>
  </g>

  <!-- 鬼マスク -->
  <g transform="translate(300,375)">
    <!-- 髪 -->
    <path d="M-150,-30 Q-150,-120 -70,-150 Q-40,-205 -8,-150 Q0,-200 8,-150 Q40,-205 70,-150 Q150,-120 150,-30 Q120,-70 90,-45 Q60,-90 30,-52 Q0,-96 -30,-52 Q-60,-90 -90,-45 Q-120,-70 -150,-30 Z" fill="#241226"/>
    <!-- 角 -->
    <path d="M-92,-118 Q-140,-150 -128,-232 Q-96,-206 -66,-134 Z" fill="url(#horn)" stroke="#b98a34" stroke-width="3"/>
    <path d="M92,-118 Q140,-150 128,-232 Q96,-206 66,-134 Z" fill="url(#horn)" stroke="#b98a34" stroke-width="3"/>
    <!-- 顔 -->
    <ellipse cx="0" cy="8" rx="150" ry="152" fill="url(#face)"/>
    <!-- ほっぺ -->
    <circle cx="-100" cy="58" r="26" fill="#ff8a5c" opacity="0.35"/>
    <circle cx="100" cy="58" r="26" fill="#ff8a5c" opacity="0.35"/>
    <!-- 眉 -->
    <path d="M-102,-38 L-34,-12" stroke="#2a1116" stroke-width="17" stroke-linecap="round"/>
    <path d="M102,-38 L34,-12" stroke="#2a1116" stroke-width="17" stroke-linecap="round"/>
    <!-- 目 -->
    <ellipse cx="-56" cy="14" rx="35" ry="41" fill="#fff7ef"/>
    <ellipse cx="56" cy="14" rx="35" ry="41" fill="#fff7ef"/>
    <circle cx="-50" cy="22" r="17" fill="#1c0c10"/>
    <circle cx="62" cy="22" r="17" fill="#1c0c10"/>
    <circle cx="-44" cy="16" r="5" fill="#fff"/>
    <circle cx="68" cy="16" r="5" fill="#fff"/>
    <!-- 鼻 -->
    <path d="M0,40 l14,26 h-28 Z" fill="#a81f14"/>
    <!-- 口 -->
    <path d="M-82,78 Q0,158 82,78 Q0,120 -82,78 Z" fill="#3a0d0c"/>
    <path d="M-46,84 l16,0 l-9,30 Z" fill="#fff7ef"/>
    <path d="M46,84 l-16,0 l9,30 Z" fill="#fff7ef"/>
  </g>

  <!-- テキスト -->
  <g transform="translate(512,0)">
    <text x="0" y="342" font-size="120" font-weight="800" letter-spacing="2">
      <tspan fill="#f4ece8">オニ</tspan><tspan fill="url(#works)">Works</tspan>
    </text>
    <rect x="6" y="368" width="300" height="7" rx="4" fill="#f5c451"/>
    <text x="8" y="424" font-size="44" font-weight="700" fill="#f5c451" letter-spacing="4">鬼ごっこネタ発掘</text>
    <text x="8" y="476" font-size="29" fill="#c9b4a8" letter-spacing="2">映画・ゲーム・トレンドから、次の企画を。</text>
  </g>
</svg>
