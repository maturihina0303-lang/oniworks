name: オニWorks データ自動更新

on:
  schedule:
    # 毎日 日本時間 朝7時（UTC 22:00）に実行
    - cron: "0 22 * * *"
  workflow_dispatch: {}   # 手動実行ボタンも有効

permissions:
  contents: write         # data/*.json をコミットするため

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存インストール
        run: pip install -r pipeline/requirements.txt

      - name: データ取得＆ネタ生成
        working-directory: pipeline
        env:
          # ↓ GitHub リポジトリの Settings > Secrets に登録してください（未設定の項目は自動でスキップ）
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python run_all.py

      - name: 変更を data/ にコミット（Supabase未使用モード用）
        run: |
          git config user.name "oniworks-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain data)" ]; then
            git add data
            git commit -m "chore: データ自動更新 $(date +%F)"
            git push
          else
            echo "変更なし（Supabaseモードか、更新差分なし）"
          fi
